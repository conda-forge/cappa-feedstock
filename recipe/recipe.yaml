schema_version: 1

context:
  name: cappa
  version: "0.33.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cappa-${{ version }}.tar.gz
  sha256: dc4f7bc69effa4ab90da4ddc40c2a43dbd9bd4e7fbb199767babfc6a3ca9492e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.12.0
    - type-lens >=0.2.5
    - rich >=12.1.0

tests:
  - python:
      imports:
        - cappa
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Declarative CLI argument parser.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/dancardin/cappa

extra:
  recipe-maintainers:
    - thewchan
